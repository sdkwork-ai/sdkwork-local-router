version: "3.8"

services:
  sdkwork-local-router-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdkwork-local-router-pg
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SDKWORK_LR_PORT:-8080}:8080"
    environment:
      SDKWORK_LR_ENCRYPTION_SECRET: ${SDKWORK_LR_ENCRYPTION_SECRET:-}
      SDKWORK_LR_BIND: "0.0.0.0"
      SDKWORK_LR_PORT: "8080"
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: postgres
      SDKWORK_DATABASE_PORT: "5432"
      SDKWORK_DATABASE_NAME: sdkwork_ai_dev
      SDKWORK_DATABASE_SCHEMA: sdkwork_ai_dev
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: sdkwork_ai_dev
      SDKWORK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SDKWORK_DATABASE_SSL_MODE: disable
    volumes:
      - ./config.example.toml:/app/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  postgres:
    image: postgres:16-alpine
    container_name: sdkwork-postgres
    environment:
      POSTGRES_USER: sdkwork_ai_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: sdkwork_ai_dev
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdkwork_ai_dev -d sdkwork_ai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pg-data:
