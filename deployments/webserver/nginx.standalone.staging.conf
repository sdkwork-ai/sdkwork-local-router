# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/local_router/webserver.pid;
error_log /var/log/sdkwork/local_router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name local-router-staging.sdkwork.com local-router-staging.birdcoder.com local-router-staging.dtupay.com local-router-staging.sdkwork.cn local-router-staging.birdcoder.cn local-router-staging.dtupay.cn local-router-staging.skubc.com local-router-staging.skubc.cn local-router-staging.zowalk.com local-router-staging.zowalk.cn local-router-staging.offer86.com local-router-staging.offer86.cn local-router-staging.86offer.com local-router-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
