# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/local_router/webserver.pid;
error_log /var/log/sdkwork/local_router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name local-router-dev.sdkwork.com local-router-dev.birdcoder.com local-router-dev.dtupay.com local-router-dev.sdkwork.cn local-router-dev.birdcoder.cn local-router-dev.dtupay.cn local-router-dev.skubc.com local-router-dev.skubc.cn local-router-dev.zowalk.com local-router-dev.zowalk.cn local-router-dev.offer86.com local-router-dev.offer86.cn local-router-dev.86offer.com local-router-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
