# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/local_router/webserver.pid;
error_log /var/log/sdkwork/local_router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name local-router-demo.sdkwork.com local-router-demo.birdcoder.com local-router-demo.dtupay.com local-router-demo.noaper.com local-router-demo.sdkwork.cn local-router-demo.birdcoder.cn local-router-demo.dtupay.cn local-router-demo.noaper.cn local-router-demo.skubc.com local-router-demo.skubc.cn local-router-demo.zowalk.com local-router-demo.zowalk.cn local-router-demo.offer86.com local-router-demo.offer86.cn local-router-demo.86offer.com local-router-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/local_router/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
